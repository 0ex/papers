name: Convert PhilSci paper 30598

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/convert-philsci-30598.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate and download current v3 PDF
        id: locate
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import traceback
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          item_url = "https://philsci-archive.pitt.edu/30598/"
          reader_url = "https://r.jina.ai/" + item_url
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          }
          diagnostics = {"item_url": item_url, "reader_url": reader_url, "attempts": []}

          try:
              page = requests.get(reader_url, headers=headers, timeout=180)
              diagnostics["reader_status"] = page.status_code
              diagnostics["reader_headers"] = dict(page.headers)
              Path("item-page.md").write_text(page.text, encoding="utf-8")
              page.raise_for_status()

              matches = re.findall(r"\[([^\]]*)\]\((https?://[^)]+)\)", page.text)
              candidates = []
              for label, url in matches:
                  url = html.unescape(url).replace("\\_", "_")
                  if ".pdf" in url.lower() or "/document/" in url.lower():
                      candidates.append((label, urljoin(item_url, url)))

              bare = re.findall(r"https?://[^\s<>()\]]+", page.text, flags=re.I)
              for url in bare:
                  clean = html.unescape(url).rstrip(".,;:'\"")
                  if ".pdf" in clean.lower() or "/document/" in clean.lower():
                      candidates.append(("", clean))

              seen = set()
              candidates = [(label, url) for label, url in candidates if not (url in seen or seen.add(url))]
              diagnostics["candidates"] = candidates
              if not candidates:
                  raise RuntimeError("No PDF/document link found in the archive page extraction")

              preferred = [c for c in candidates if "v3" in (c[0] + " " + c[1]).lower()]
              ordered = preferred + [c for c in candidates if c not in preferred]
              for label, pdf_url in ordered:
                  attempt = {"label": label, "url": pdf_url}
                  diagnostics["attempts"].append(attempt)
                  try:
                      response = requests.get(pdf_url, headers=headers, timeout=300, allow_redirects=True)
                      attempt["status"] = response.status_code
                      attempt["headers"] = dict(response.headers)
                      attempt["size"] = len(response.content)
                      attempt["prefix"] = response.content[:20].hex()
                      if response.ok and response.content.startswith(b"%PDF"):
                          Path("source.pdf").write_bytes(response.content)
                          metadata = {
                              "item_url": item_url,
                              "page_via": reader_url,
                              "selected_label": label,
                              "pdf_url": pdf_url,
                              "pdf_candidates": candidates,
                              "pdf_size_bytes": len(response.content),
                          }
                          Path("source.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
                          Path("pdf-url.txt").write_text(pdf_url + "\n", encoding="utf-8")
                          diagnostics["selected"] = metadata
                          break
                  except Exception as exc:
                      attempt["error"] = repr(exc)
              else:
                  raise RuntimeError("None of the candidate links returned a PDF")
          except Exception:
              Path("locate-error.txt").write_text(traceback.format_exc(), encoding="utf-8")
          finally:
              Path("diagnostics.json").write_text(json.dumps(diagnostics, indent=2), encoding="utf-8")
              print(json.dumps(diagnostics, indent=2))
          PY

      - name: Produce Jina PDF extraction
        if: hashFiles('source.pdf') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests

          pdf_url = json.loads(Path("source.json").read_text())["pdf_url"]
          response = requests.get("https://r.jina.ai/" + pdf_url, timeout=600)
          response.raise_for_status()
          Path("paper-jina.md").write_text(response.text, encoding="utf-8")
          PY

      - name: Install equation-aware converter
        id: marker_install
        if: hashFiles('source.pdf') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir marker-pdf

      - name: Convert PDF with Marker
        if: hashFiles('source.pdf') != '' && steps.marker_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p marker-output
          marker_single --help > marker-help.txt 2>&1
          args=(source.pdf --output_dir marker-output --output_format markdown)
          if grep -q -- '--paginate_output' marker-help.txt; then
            args+=(--paginate_output)
          fi
          if grep -q -- '--force_ocr' marker-help.txt; then
            args+=(--force_ocr)
          fi
          TORCH_DEVICE=cpu marker_single "${args[@]}" 2>&1 | tee marker.log
          echo "${PIPESTATUS[0]}" > marker-exit-status.txt
          exit 0

      - name: Prepare output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf conversion
          mkdir -p conversion/marker
          cp diagnostics.json conversion/
          cp item-page.md conversion/ 2>/dev/null || true
          cp locate-error.txt conversion/ 2>/dev/null || true
          cp source.json pdf-url.txt source.pdf conversion/ 2>/dev/null || true
          cp paper-jina.md conversion/ 2>/dev/null || true
          cp -a marker-output/. conversion/marker/ 2>/dev/null || true
          cp marker-help.txt marker.log marker-exit-status.txt conversion/ 2>/dev/null || true

          marker_md="$(find marker-output -type f -name '*.md' -size +1000c -print -quit 2>/dev/null || true)"
          if [[ -n "$marker_md" ]]; then
            cp "$marker_md" conversion/philsci-30598-v3.md
            printf 'marker\n' > conversion/selected-converter.txt
          elif [[ -s paper-jina.md ]]; then
            cp paper-jina.md conversion/philsci-30598-v3.md
            printf 'jina\n' > conversion/selected-converter.txt
          fi

          if [[ -s conversion/philsci-30598-v3.md ]]; then
            python - <<'PY'
          import json
          import re
          from pathlib import Path
          p = Path("conversion/philsci-30598-v3.md")
          text = p.read_text(encoding="utf-8", errors="replace")
          stats = {
              "bytes": p.stat().st_size,
              "lines": text.count("\n") + 1,
              "display_math_delimiters": text.count("$$"),
              "latex_commands": len(re.findall(r"\\[A-Za-z]+", text)),
              "equation_environments": len(re.findall(r"\\begin\{(?:equation|align|gather|multline)", text)),
          }
          Path("conversion/conversion-stats.json").write_text(json.dumps(stats, indent=2), encoding="utf-8")
          print(stats)
          PY
          fi

      - name: Upload conversion and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: philsci-30598-v3-conversion
          retention-days: 7
          if-no-files-found: error
          path: conversion/

      - name: Publish temporary output branch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch --orphan conversion-output-30598
          git rm -rf . >/dev/null 2>&1 || true
          git add -f conversion
          git commit -m "Add PhilSci 30598 v3 conversion diagnostics"
          git push --force origin HEAD:refs/heads/conversion-output-30598
