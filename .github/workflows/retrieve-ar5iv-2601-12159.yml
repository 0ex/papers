name: Retrieve ar5iv HTML 2601.12159

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download equation-preserving HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for url in \
            'https://ar5iv.labs.arxiv.org/html/2601.12159' \
            'https://ar5iv.org/html/2601.12159' \
            'https://arxiv.org/html/2601.12159'; do
            echo "$url" | tee -a output/attempts.txt
            if curl -fL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' "$url" -o output/arxiv-2601.12159.html; then
              test "$(wc -c < output/arxiv-2601.12159.html)" -gt 10000
              printf '%s\n' "$url" > output/source-url.txt
              break
            fi
          done
          test -s output/arxiv-2601.12159.html
          grep -o 'alttext="[^"]*"' output/arxiv-2601.12159.html | sed 's/^alttext="//;s/"$//' > output/equation-alttext.txt || true
          printf 'bytes=%s\nmathml=%s\nalttext=%s\n' \
            "$(wc -c < output/arxiv-2601.12159.html)" \
            "$(grep -c '<math' output/arxiv-2601.12159.html || true)" \
            "$(wc -l < output/equation-alttext.txt)" > output/stats.txt
          cat output/source-url.txt output/stats.txt

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: ar5iv-2601-12159-html
          retention-days: 7
          if-no-files-found: error
          path: output/

      - name: Publish HTML output branch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch --orphan ar5iv-output-2601-12159
          git rm -rf . >/dev/null 2>&1 || true
          git add -f output
          git commit -m 'Add ar5iv 2601.12159 HTML'
          git push --force origin HEAD:refs/heads/ar5iv-output-2601-12159
