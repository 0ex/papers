name: Retrieve PhilSci paper 30598

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Retrieve item page and document
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import html
          import json
          import re
          import ssl
          import traceback
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import urljoin

          item_url = "https://philsci-archive.pitt.edu/30598/"
          reader_url = "https://r.jina.ai/" + item_url
          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          diagnostics = {"item_url": item_url, "reader_url": reader_url, "attempts": []}
          context = ssl.create_default_context()

          def fetch(url, timeout=300):
              request = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "*/*"})
              with urllib.request.urlopen(request, timeout=timeout, context=context) as response:
                  return response.getcode(), dict(response.headers), response.read(), response.geturl()

          try:
              status, headers, body, final_url = fetch(reader_url, 180)
              diagnostics["reader_status"] = status
              diagnostics["reader_headers"] = headers
              diagnostics["reader_final_url"] = final_url
              page_text = body.decode("utf-8", errors="replace")
              Path("item-page.md").write_text(page_text, encoding="utf-8")

              candidates = []
              for label, url in re.findall(r"\[([^\]]*)\]\((https?://[^)]+)\)", page_text):
                  clean = html.unescape(url).replace("\\_", "_")
                  if ".pdf" in clean.lower() or "/document/" in clean.lower():
                      candidates.append((label, urljoin(item_url, clean)))
              for url in re.findall(r"https?://[^\s<>()\]]+", page_text, flags=re.I):
                  clean = html.unescape(url).rstrip(".,;:'\"")
                  if ".pdf" in clean.lower() or "/document/" in clean.lower():
                      candidates.append(("", clean))

              seen = set()
              candidates = [(label, url) for label, url in candidates if not (url in seen or seen.add(url))]
              diagnostics["candidates"] = candidates
              preferred = [c for c in candidates if "v3" in (c[0] + " " + c[1]).lower()]
              ordered = preferred + [c for c in candidates if c not in preferred]

              for label, document_url in ordered:
                  attempt = {"label": label, "url": document_url}
                  diagnostics["attempts"].append(attempt)

                  try:
                      status, headers, body, final_url = fetch(document_url, 300)
                      attempt["direct"] = {
                          "status": status,
                          "headers": headers,
                          "final_url": final_url,
                          "bytes": len(body),
                          "prefix": body[:20].hex(),
                      }
                      if body.startswith(b"%PDF") and not Path("source.pdf").exists():
                          Path("source.pdf").write_bytes(body)
                          diagnostics["selected_pdf"] = {"label": label, "url": document_url, "bytes": len(body)}
                  except Exception as exc:
                      attempt["direct_error"] = repr(exc)

                  try:
                      jina_url = "https://r.jina.ai/" + document_url
                      status, headers, body, final_url = fetch(jina_url, 600)
                      text = body.decode("utf-8", errors="replace")
                      attempt["jina"] = {
                          "status": status,
                          "headers": headers,
                          "final_url": final_url,
                          "bytes": len(body),
                      }
                      if len(text) > 1000 and not Path("paper-jina.md").exists():
                          Path("paper-jina.md").write_text(text, encoding="utf-8")
                          diagnostics["selected_jina"] = {"label": label, "url": document_url, "bytes": len(body)}
                  except Exception as exc:
                      attempt["jina_error"] = repr(exc)

                  if Path("source.pdf").exists() and Path("paper-jina.md").exists():
                      break

              if not candidates:
                  diagnostics["error"] = "No PDF/document candidate found in item-page extraction"
          except Exception:
              diagnostics["fatal_error"] = traceback.format_exc()
          finally:
              Path("diagnostics.json").write_text(json.dumps(diagnostics, indent=2), encoding="utf-8")
              print(json.dumps(diagnostics, indent=2))
          PY

      - name: Install equation-aware converter
        id: marker_install
        if: hashFiles('source.pdf') != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir marker-pdf

      - name: Convert PDF with Marker
        if: hashFiles('source.pdf') != '' && steps.marker_install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p marker-output
          marker_single --help > marker-help.txt 2>&1
          args=(source.pdf --output_dir marker-output --output_format markdown)
          if grep -q -- '--paginate_output' marker-help.txt; then
            args+=(--paginate_output)
          fi
          TORCH_DEVICE=cpu marker_single "${args[@]}" 2>&1 | tee marker.log
          echo "${PIPESTATUS[0]}" > marker-exit-status.txt
          exit 0

      - name: Prepare output and equation checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf conversion
          mkdir -p conversion/marker
          cp diagnostics.json conversion/
          cp item-page.md conversion/ 2>/dev/null || true
          cp source.pdf conversion/philsci-30598-v3.pdf 2>/dev/null || true
          cp paper-jina.md conversion/ 2>/dev/null || true
          cp postsel/paper-1-classic-bins.md conversion/repository-candidate.md 2>/dev/null || true
          cp -a marker-output/. conversion/marker/ 2>/dev/null || true
          cp marker-help.txt marker.log marker-exit-status.txt conversion/ 2>/dev/null || true

          marker_md="$(find marker-output -type f -name '*.md' -size +1000c -print -quit 2>/dev/null || true)"
          if [[ -n "$marker_md" ]]; then
            cp "$marker_md" conversion/philsci-30598-v3.md
            printf 'marker\n' > conversion/selected-converter.txt
          elif [[ -s paper-jina.md ]]; then
            cp paper-jina.md conversion/philsci-30598-v3.md
            printf 'jina\n' > conversion/selected-converter.txt
          elif [[ -s postsel/paper-1-classic-bins.md ]]; then
            cp postsel/paper-1-classic-bins.md conversion/philsci-30598-v3.md
            printf 'repository-candidate-unverified\n' > conversion/selected-converter.txt
          fi

          python - <<'PY'
          import difflib
          import json
          import re
          from pathlib import Path

          def stats(path):
              p = Path(path)
              if not p.exists():
                  return None
              text = p.read_text(encoding="utf-8", errors="replace")
              title = next((line.lstrip("# ").strip() for line in text.splitlines() if line.startswith("#")), "")
              return {
                  "path": str(p),
                  "bytes": p.stat().st_size,
                  "lines": text.count("\n") + 1,
                  "title": title,
                  "display_math_delimiters": text.count("$$"),
                  "inline_math_delimiters": text.count("$"),
                  "latex_commands": len(re.findall(r"\\[A-Za-z]+", text)),
                  "equation_environments": len(re.findall(r"\\begin\{(?:equation|align|gather|multline)", text)),
              }

          report = {
              "selected": stats("conversion/philsci-30598-v3.md"),
              "jina": stats("conversion/paper-jina.md"),
              "repository_candidate": stats("conversion/repository-candidate.md"),
          }
          selected = Path("conversion/philsci-30598-v3.md")
          candidate = Path("conversion/repository-candidate.md")
          if selected.exists() and candidate.exists():
              a = selected.read_text(encoding="utf-8", errors="replace")
              b = candidate.read_text(encoding="utf-8", errors="replace")
              report["selected_vs_repository_similarity"] = difflib.SequenceMatcher(None, a, b, autojunk=False).ratio()
          Path("conversion/conversion-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: philsci-30598-v3-result
          retention-days: 7
          if-no-files-found: error
          path: conversion/

      - name: Publish output branch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch --orphan conversion-output-30598
          git rm -rf . >/dev/null 2>&1 || true
          git add -f conversion
          git commit -m "Add PhilSci 30598 v3 retrieval result"
          git push --force origin HEAD:refs/heads/conversion-output-30598
